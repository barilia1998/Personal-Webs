<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#f5f9ff;
  --surface:#ffffff;
  --surface-soft:#f8fbff;
  --line:#dfeaf5;
  --line-strong:#cbdeef;
  --ink:#09284a;
  --muted:#71869d;
  --navy:#002f71;
  --blue:#005de1;
  --blue-2:#049efa;
  --cyan:#13d2ea;
  --success:#278a63;
  --shadow:0 18px 60px rgba(0,47,113,.09);
  --shadow-soft:0 8px 30px rgba(0,93,225,.07);
  --radius:28px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

.section-shell,
.nav-shell,
.hero-shell{
  width:min(1180px,calc(100% - 40px));
  margin:0 auto;
}


/* =====================================================
   HEADER
===================================================== */

.site-header{
  position:fixed;
  z-index:100;
  inset:0 0 auto;
  border-bottom:1px solid rgba(0,93,225,.07);
  background:rgba(245,249,255,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.nav-shell{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:11px;
}

.brand-mark{
  width:43px;
  height:43px;
  flex:0 0 43px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:13px;
  background:#fff;
  box-shadow:0 8px 22px rgba(0,93,225,.11);
}

.brand-mark img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.brand-copy{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.brand-copy strong{
  color:var(--navy);
  font-size:16px;
  font-weight:900;
  letter-spacing:.02em;
}

.brand-copy small{
  color:#8297ab;
  font-size:8px;
  font-weight:700;
  letter-spacing:.04em;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:28px;
}

.desktop-nav a{
  color:#5a7189;
  font-size:12px;
  font-weight:750;
  transition:.18s ease;
}

.desktop-nav a:hover{
  color:var(--blue);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.nav-login,
.nav-cta{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 14px;
  border-radius:12px;
  font-size:11px;
  font-weight:850;
}

.nav-login{
  color:#52708d;
}

.nav-cta{
  background:linear-gradient(135deg,var(--blue),var(--blue-2));
  color:#fff;
  box-shadow:0 8px 22px rgba(0,93,225,.18);
}

.mobile-menu-button{
  width:42px;
  height:42px;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:4px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.mobile-menu-button span{
  width:17px;
  height:2px;
  border-radius:999px;
  background:var(--navy);
}

.mobile-menu{
  display:none;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  position:relative;
  overflow:hidden;
  min-height:820px;
  padding:150px 0 92px;
  background:
    linear-gradient(180deg,#f7fbff 0%,#f4f9ff 72%,#fff 100%);
}

.hero-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
}

.hero-orb-one{
  width:460px;
  height:460px;
  top:80px;
  right:-130px;
  background:radial-gradient(circle,rgba(19,210,234,.15),rgba(19,210,234,0) 70%);
}

.hero-orb-two{
  width:420px;
  height:420px;
  bottom:-160px;
  left:-130px;
  background:radial-gradient(circle,rgba(0,93,225,.12),rgba(0,93,225,0) 70%);
}

.hero-shell{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(420px,.9fr);
  align-items:center;
  gap:64px;
}

.hero-copy{
  max-width:640px;
}

.eyebrow-pill{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:0 13px;
  border:1px solid #cfe4f8;
  border-radius:999px;
  background:rgba(255,255,255,.82);
  color:#4e789d;
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
}

.eyebrow-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 0 4px rgba(19,210,234,.12);
}

.hero h1{
  margin:20px 0 18px;
  color:var(--navy);
  font-size:clamp(46px,5.1vw,72px);
  line-height:.98;
  letter-spacing:-.052em;
}

.hero h1 span{
  display:block;
  background:linear-gradient(90deg,var(--blue),var(--blue-2));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-copy>p{
  max-width:590px;
  margin:0;
  color:#617b94;
  font-size:17px;
  line-height:1.7;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:30px;
}

.button{
  min-height:52px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:0 19px;
  border-radius:15px;
  font-size:12px;
  font-weight:850;
}

.button-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue-2));
  color:#fff;
  box-shadow:0 12px 28px rgba(0,93,225,.2);
}

.button-secondary{
  border:1px solid var(--line-strong);
  background:#fff;
  color:#4f6882;
}

.button-light{
  background:#fff;
  color:var(--navy);
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.hero-proof{
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:30px;
}

.hero-proof>div{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.hero-proof strong{
  color:var(--navy);
  font-size:11px;
}

.hero-proof span{
  color:#8396aa;
  font-size:8px;
}

.hero-proof>i{
  width:1px;
  height:26px;
  background:#d8e5f0;
}


/* Hero app mock */

.hero-visual{
  position:relative;
  min-height:620px;
  display:grid;
  place-items:center;
}

.hero-phone{
  position:relative;
  width:340px;
  min-height:660px;
  padding:12px 14px 86px;
  overflow:hidden;
  border:8px solid #fff;
  border-radius:42px;
  background:#f8fbff;
  box-shadow:
    0 35px 80px rgba(0,47,113,.18),
    0 0 0 1px rgba(0,47,113,.04);
}

.phone-status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 5px 13px;
  color:#2f4f70;
  font-size:9px;
  font-weight:800;
}

.phone-status>div{
  display:flex;
  gap:3px;
}

.phone-status i{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#345571;
}

.phone-app-head{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) 34px;
  align-items:center;
  gap:9px;
  margin-bottom:14px;
}

.phone-app-head .mini-logo{
  width:42px;
  height:42px;
  overflow:hidden;
  border-radius:13px;
  background:#fff;
  box-shadow:0 5px 16px rgba(0,93,225,.08);
}

.phone-app-head .mini-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.phone-app-head small{
  display:block;
  color:#7d94aa;
  font-size:6px;
  font-weight:850;
  letter-spacing:.08em;
}

.phone-app-head strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:14px;
}

.phone-app-head button{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:11px;
  background:#eef6ff;
  color:var(--blue);
}

.phone-app-head svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.preview-trip{
  padding:15px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  box-shadow:0 12px 28px rgba(0,93,225,.18);
}

.preview-trip-head{
  display:flex;
  gap:11px;
}

.trip-plane{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:0 0 38px;
  border-radius:12px;
  background:rgba(255,255,255,.13);
  font-size:17px;
}

.preview-trip small,
.preview-section-title small,
.preview-alert small{
  display:block;
  color:rgba(255,255,255,.58);
  font-size:6px;
  font-weight:850;
  letter-spacing:.08em;
}

.preview-trip-head strong{
  display:block;
  margin-top:3px;
  font-size:14px;
}

.preview-trip-head p{
  margin:3px 0 0;
  color:rgba(255,255,255,.7);
  font-size:8px;
}

.preview-trip-foot{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-top:17px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);
}

.preview-trip-foot strong{
  display:block;
  margin-top:2px;
  font-size:17px;
}

.preview-trip-foot>span{
  font-size:8px;
  font-weight:800;
}

.preview-section-title{
  margin:17px 1px 9px;
}

.preview-section-title small{
  color:#8095a8;
}

.preview-section-title strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:12px;
}

.preview-kpis{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.preview-kpis>div{
  padding:11px 8px;
  border:1px solid #e4edf6;
  border-radius:14px;
  background:#fff;
}

.preview-kpis small{
  display:block;
  color:#8396a9;
  font-size:6px;
}

.preview-kpis strong{
  display:block;
  margin-top:5px;
  color:var(--navy);
  font-size:10px;
}

.preview-alert{
  display:grid;
  grid-template-columns:32px minmax(0,1fr) auto;
  align-items:center;
  gap:9px;
  margin-top:10px;
  padding:11px;
  border:1px solid #cfe2f4;
  border-radius:15px;
  background:#fff;
}

.preview-alert>span{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#eaf4ff;
  color:var(--blue);
  font-size:11px;
  font-weight:900;
}

.preview-alert small{
  color:#7f98b0;
}

.preview-alert strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:9px;
}

.preview-alert p{
  margin:2px 0 0;
  color:#8b9bac;
  font-size:6px;
}

.preview-alert b{
  color:#7890a5;
}

.preview-bottom-nav{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:center;
  padding:0 12px 8px;
  border-top:1px solid #e6eef5;
  background:#fff;
}

.preview-bottom-nav>div{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  color:#92a2b2;
}

.preview-bottom-nav span{
  font-size:14px;
}

.preview-bottom-nav small{
  font-size:6px;
  font-weight:800;
}

.preview-bottom-nav .active{
  color:var(--blue);
}

.floating-card{
  position:absolute;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  border:1px solid rgba(0,93,225,.12);
  border-radius:16px;
  background:rgba(255,255,255,.94);
  box-shadow:0 16px 36px rgba(0,47,113,.12);
  backdrop-filter:blur(14px);
}

.floating-icon{
  width:35px;
  height:35px;
  flex:0 0 35px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#eaf5ff;
  color:var(--blue);
  font-size:12px;
  font-weight:900;
}

.floating-card small{
  display:block;
  color:#8096aa;
  font-size:6px;
  font-weight:850;
  letter-spacing:.08em;
}

.floating-card strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:9px;
}

.floating-order{
  top:140px;
  right:-44px;
}

.floating-payment{
  bottom:120px;
  left:-70px;
}


/* =====================================================
   TRUST STRIP
===================================================== */

.trust-strip{
  background:#fff;
  border-top:1px solid #edf3f8;
  border-bottom:1px solid #edf3f8;
}

.trust-shell{
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.trust-shell>span{
  color:#7b91a7;
  font-size:10px;
  font-weight:750;
}

.trust-shell>div{
  display:flex;
  align-items:center;
  gap:13px;
  flex-wrap:wrap;
}

.trust-shell b{
  color:#496681;
  font-size:9px;
}

.trust-shell i{
  width:4px;
  height:4px;
  border-radius:50%;
  background:#c6d6e5;
}


/* =====================================================
   SECTIONS
===================================================== */

.problem-section,
.feature-section,
.workflow-section,
.buyer-highlight,
.pricing-section,
.faq-section{
  padding:96px 0;
}

.problem-section{
  background:#fff;
}

.feature-section{
  background:#f6faff;
}

.workflow-section{
  background:#fff;
}

.buyer-highlight{
  background:
    linear-gradient(180deg,#f4f9ff,#f8fbff);
}

.pricing-section{
  background:#fff;
}

.faq-section{
  background:#f6faff;
}

.section-heading{
  max-width:620px;
  margin-bottom:38px;
}

.section-heading.centered{
  margin-left:auto;
  margin-right:auto;
  text-align:center;
}

.section-heading>span,
.buyer-highlight-copy>span,
.final-cta-card>div>span{
  display:block;
  margin-bottom:7px;
  color:var(--blue);
  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
}

.section-heading h2,
.buyer-highlight-copy h2,
.final-cta-card h2{
  margin:0;
  color:var(--navy);
  font-size:clamp(32px,4vw,48px);
  line-height:1.08;
  letter-spacing:-.035em;
}

.section-heading p,
.buyer-highlight-copy>p{
  margin:13px 0 0;
  color:#6c8399;
  font-size:14px;
  line-height:1.7;
}


/* =====================================================
   PROBLEM
===================================================== */

.problem-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.problem-grid article{
  padding:24px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:var(--shadow-soft);
}

.problem-number{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#edf6ff;
  color:var(--blue);
  font-size:9px;
  font-weight:900;
}

.problem-grid h3{
  margin:17px 0 7px;
  color:var(--navy);
  font-size:17px;
}

.problem-grid p{
  margin:0;
  color:#73889d;
  font-size:11px;
  line-height:1.65;
}


/* =====================================================
   FEATURES
===================================================== */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.feature-card{
  min-height:260px;
  padding:22px;
  border:1px solid var(--line);
  border-radius:24px;
  background:#fff;
  box-shadow:var(--shadow-soft);
}

.feature-card-large,
.feature-storefront-card{
  grid-column:span 2;
}

.feature-card-large{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(240px,.75fr);
  align-items:end;
  gap:20px;
}

.feature-storefront-card{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(240px,.72fr);
  align-items:center;
  gap:20px;
}

.feature-icon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  margin-bottom:20px;
  border-radius:14px;
  background:#edf6ff;
  color:var(--blue);
}

.feature-icon svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.feature-card small{
  display:block;
  color:#8298ad;
  font-size:8px;
  font-weight:850;
  letter-spacing:.08em;
}

.feature-card h3{
  margin:6px 0 8px;
  color:var(--navy);
  font-size:20px;
  line-height:1.2;
}

.feature-card p{
  margin:0;
  color:#71869b;
  font-size:11px;
  line-height:1.65;
}

.mini-dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:11px;
  border-radius:18px;
  background:#f7fbff;
}

.mini-dashboard>div{
  padding:12px 8px;
  border:1px solid #e4edf5;
  border-radius:12px;
  background:#fff;
}

.mini-dashboard small{
  font-size:6px;
}

.mini-dashboard strong{
  display:block;
  margin-top:5px;
  color:var(--navy);
  font-size:11px;
}

.storefront-preview{
  padding:15px;
  border:1px solid #e2edf6;
  border-radius:20px;
  background:#f9fcff;
}

.storefront-preview-head{
  display:flex;
  align-items:center;
  gap:8px;
}

.storefront-preview-head>span{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  font-size:11px;
  font-weight:900;
}

.storefront-preview-head small{
  font-size:5px;
}

.storefront-preview-head strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:10px;
}

.storefront-trip{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
}

.storefront-trip small{
  color:rgba(255,255,255,.55);
  font-size:5px;
}

.storefront-trip strong{
  display:block;
  margin-top:2px;
  font-size:10px;
}

.storefront-trip span{
  display:block;
  margin-top:6px;
  color:rgba(255,255,255,.72);
  font-size:6px;
}

.storefront-products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:7px;
}

.storefront-products>div{
  padding:7px;
  border:1px solid #e5edf5;
  border-radius:11px;
  background:#fff;
}

.storefront-products>div>span{
  display:block;
  height:46px;
  border-radius:8px;
  background:
    linear-gradient(135deg,#e9f3fc,#d8ebfb);
}

.storefront-products strong{
  display:block;
  margin-top:6px;
  color:var(--navy);
  font-size:7px;
}

.storefront-products small{
  margin-top:2px;
  color:var(--blue);
  font-size:6px;
}


/* =====================================================
   WORKFLOW
===================================================== */

.workflow-shell{
  display:grid;
  grid-template-columns:minmax(260px,.75fr) minmax(0,1.25fr);
  gap:70px;
  align-items:start;
}

.workflow-grid{
  display:grid;
  gap:10px;
}

.workflow-grid article{
  display:grid;
  grid-template-columns:46px minmax(0,1fr);
  gap:14px;
  padding:19px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  box-shadow:var(--shadow-soft);
}

.workflow-grid article>span{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:#edf6ff;
  color:var(--blue);
  font-size:14px;
  font-weight:900;
}

.workflow-grid small{
  display:block;
  color:#8499ad;
  font-size:7px;
  font-weight:850;
  letter-spacing:.08em;
}

.workflow-grid h3{
  margin:4px 0 6px;
  color:var(--navy);
  font-size:16px;
}

.workflow-grid p{
  margin:0;
  color:#72879c;
  font-size:10px;
  line-height:1.6;
}


/* =====================================================
   BUYER HIGHLIGHT
===================================================== */

.buyer-highlight-shell{
  display:grid;
  grid-template-columns:minmax(340px,.9fr) minmax(0,1fr);
  gap:80px;
  align-items:center;
}

.buyer-highlight-visual{
  display:grid;
  place-items:center;
}

.buyer-phone{
  width:310px;
  padding:16px;
  border:8px solid #fff;
  border-radius:38px;
  background:#fbfdff;
  box-shadow:0 30px 70px rgba(0,47,113,.16);
}

.buyer-phone-head{
  display:flex;
  align-items:center;
  gap:9px;
}

.buyer-avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.buyer-phone-head small,
.buyer-catalog-title small{
  display:block;
  color:#8398ac;
  font-size:6px;
  font-weight:850;
  letter-spacing:.07em;
}

.buyer-phone-head strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:12px;
}

.buyer-open-trip{
  margin-top:15px;
  padding:15px;
  border-radius:17px;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
}

.buyer-open-trip small{
  color:rgba(255,255,255,.58);
  font-size:6px;
  font-weight:850;
  letter-spacing:.07em;
}

.buyer-open-trip strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.buyer-open-trip p{
  margin:3px 0 0;
  color:rgba(255,255,255,.7);
  font-size:7px;
}

.buyer-open-trip span{
  display:inline-block;
  margin-top:10px;
  padding:5px 7px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  font-size:6px;
}

.buyer-catalog-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-top:17px;
}

.buyer-catalog-title strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:12px;
}

.buyer-catalog-title>span{
  color:#8296aa;
  font-size:7px;
}

.buyer-product-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.buyer-product{
  padding:7px;
  border:1px solid #e4edf5;
  border-radius:13px;
  background:#fff;
}

.buyer-product>div{
  height:100px;
  border-radius:9px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.8),transparent 25%),
    linear-gradient(145deg,#e1effa,#cde4f6);
}

.buyer-product small{
  display:block;
  margin-top:7px;
  color:#8da0b1;
  font-size:6px;
}

.buyer-product strong{
  display:block;
  margin-top:2px;
  color:var(--navy);
  font-size:8px;
}

.buyer-product b{
  display:block;
  margin-top:4px;
  color:var(--blue);
  font-size:7px;
}

.buyer-highlight-copy{
  max-width:570px;
}

.buyer-benefits{
  display:grid;
  gap:10px;
  margin-top:24px;
}

.buyer-benefits>div{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.buyer-benefits span{
  width:24px;
  height:24px;
  flex:0 0 24px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:#e9f6f1;
  color:var(--success);
  font-size:10px;
  font-weight:900;
}

.buyer-benefits p{
  margin:2px 0 0;
  color:#607a93;
  font-size:11px;
}

.buyer-benefits strong{
  color:var(--navy);
}


/* =====================================================
   PRICING
===================================================== */

.pricing-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  align-items:stretch;
}

.pricing-card{
  position:relative;
  display:flex;
  flex-direction:column;
  padding:24px;
  border:1px solid var(--line);
  border-radius:24px;
  background:#fff;
  box-shadow:var(--shadow-soft);
}

.pricing-card.featured{
  border-color:transparent;
  background:linear-gradient(145deg,var(--navy),var(--blue));
  color:#fff;
  transform:translateY(-8px);
  box-shadow:0 22px 50px rgba(0,93,225,.19);
}

.pricing-popular{
  position:absolute;
  top:17px;
  right:17px;
  padding:6px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:6px;
  font-weight:900;
  letter-spacing:.08em;
}

.pricing-head small{
  color:var(--blue);
  font-size:8px;
  font-weight:900;
  letter-spacing:.1em;
}

.pricing-card.featured .pricing-head small{
  color:rgba(255,255,255,.63);
}

.pricing-head h3{
  margin:6px 0 0;
  color:var(--navy);
  font-size:16px;
  line-height:1.35;
}

.pricing-card.featured .pricing-head h3{
  color:#fff;
}

.pricing-price{
  margin:22px 0 18px;
}

.pricing-price strong{
  color:var(--navy);
  font-size:31px;
  letter-spacing:-.04em;
}

.pricing-price span{
  color:#8597aa;
  font-size:9px;
}

.pricing-card.featured .pricing-price strong{
  color:#fff;
}

.pricing-card.featured .pricing-price span{
  color:rgba(255,255,255,.6);
}

.pricing-card ul{
  flex:1;
  display:grid;
  gap:10px;
  margin:0;
  padding:0;
  list-style:none;
}

.pricing-card li{
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#61788f;
  font-size:10px;
  line-height:1.45;
}

.pricing-card li span{
  color:var(--success);
  font-weight:900;
}

.pricing-card.featured li{
  color:rgba(255,255,255,.79);
}

.pricing-card.featured li span{
  color:#7ff0d1;
}

.pricing-button{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:22px;
  border-radius:13px;
  font-size:10px;
  font-weight:850;
}

.pricing-button.secondary{
  border:1px solid var(--line-strong);
  color:#506b85;
}

.pricing-button.primary{
  background:#fff;
  color:var(--navy);
}

.pricing-note{
  margin:18px auto 0;
  color:#90a0af;
  font-size:8px;
  text-align:center;
}


/* =====================================================
   FAQ
===================================================== */

.faq-shell{
  display:grid;
  grid-template-columns:minmax(260px,.7fr) minmax(0,1.3fr);
  gap:70px;
  align-items:start;
}

.faq-list{
  display:grid;
  gap:8px;
}

.faq-item{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
}

.faq-item button{
  width:100%;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:0 17px;
  border:0;
  background:transparent;
  color:var(--navy);
  text-align:left;
  font-size:11px;
  font-weight:800;
}

.faq-item button b{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  flex:0 0 28px;
  border-radius:9px;
  background:#edf6ff;
  color:var(--blue);
  font-size:16px;
  font-weight:500;
  transition:.2s ease;
}

.faq-item>div{
  max-height:0;
  overflow:hidden;
  transition:max-height .24s ease;
}

.faq-item p{
  margin:0;
  padding:0 17px 17px;
  color:#70869b;
  font-size:10px;
  line-height:1.65;
}

.faq-item.open>div{
  max-height:160px;
}

.faq-item.open button b{
  transform:rotate(45deg);
}


/* =====================================================
   FINAL CTA + FOOTER
===================================================== */

.final-cta{
  padding:88px 0;
  background:#fff;
}

.final-cta-card{
  min-height:270px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:40px;
  padding:48px;
  overflow:hidden;
  border-radius:32px;
  background:
    radial-gradient(circle at 90% 20%,rgba(19,210,234,.22),transparent 27%),
    linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  box-shadow:0 24px 60px rgba(0,93,225,.18);
}

.final-cta-card>div{
  max-width:680px;
}

.final-cta-card>div>span{
  color:rgba(255,255,255,.62);
}

.final-cta-card h2{
  color:#fff;
}

.final-cta-card p{
  margin:12px 0 0;
  color:rgba(255,255,255,.72);
  font-size:12px;
  line-height:1.6;
}

.site-footer{
  padding:34px 0 40px;
  border-top:1px solid #e8f0f6;
  background:#f8fbff;
}

.footer-shell{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:20px;
}

.footer-brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.footer-brand strong{
  display:block;
  color:var(--navy);
  font-size:14px;
}

.footer-brand p{
  margin:3px 0 0;
  color:#8397aa;
  font-size:8px;
}

.footer-links{
  display:flex;
  align-items:center;
  gap:18px;
}

.footer-links a{
  color:#6d8399;
  font-size:9px;
  font-weight:750;
}

.footer-shell>small{
  grid-column:1/-1;
  padding-top:18px;
  border-top:1px solid #e5edf5;
  color:#95a4b2;
  font-size:7px;
}

  .hero{

  .hero h1{

  .hero-proof>div{

  }

  .hero-proof strong{

  }

  .hero-proof span{
    font-size:6px;
  }

  .hero-visual{

  }

  .hero-phone{
    width:315px;
    min-height:620px;
  }

  .floating-order{
    right:-4px;
  }

  .floating-payment{
    left:-4px;
  }

  .trust-shell{
    min-height:92px;
    display:block;
    padding:20px 0;
    text-align:center;
  }

  .trust-shell>span{
    display:block;
    margin-bottom:12px;
  }

  .trust-shell>div{
    justify-content:center;
  }

  .problem-section,
  .feature-section,
  .workflow-section,
  .buyer-highlight,
  .pricing-section,
  .faq-section{
    padding:72px 0;
  }

  .section-heading{
    margin-bottom:28px;
  }

  .problem-grid,
  .pricing-grid{
    grid-template-columns:1fr;
  }

  .pricing-card.featured{
    transform:none;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .feature-card-large,
  .feature-storefront-card{
    grid-column:auto;

  }

  .buyer-highlight-shell{

  .buyer-highlight-visual{

  }

  .buyer-highlight-copy{
    text-align:left;
  }

  .final-cta-card{

  .final-cta-card .button{

  }

  }

  }

  }

  .buyer-phone{

  }

  .final-cta{

  }

.download-note{
