<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#eef7ff;
  color:#082b63;
}
body{overflow:hidden}
.app{
  width:100%;
  min-height:100vh;
  position:relative;
  background:#f5faff;
  padding:14px 14px 94px;
}
.topbar{
  display:grid;
  grid-template-columns:42px 1fr 44px;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}
.logo{
  width:42px;height:42px;
  display:grid;place-items:center;
  position:relative;
}
.logo:before{
  content:"";
  width:25px;height:25px;
  border:4px solid #00a8ff;
  border-top-color:#004abf;
  border-left-color:#17d6e5;
  border-radius:9px 9px 12px 12px;
  transform:rotate(-16deg);
}
.logo:after{
  content:"";
  position:absolute;
  width:17px;height:9px;
  border:3px solid #045ee5;
  border-bottom:0;
  border-radius:12px 12px 0 0;
  top:8px;left:13px;
}
.title small{
  display:block;
  font-size:7px;
  letter-spacing:.75px;
  font-weight:800;
  color:#7391b2;
  margin-bottom:3px;
}
.title h1{
  margin:0;
  font-size:20px;
  line-height:1.05;
  font-weight:850;
  color:#002f71;
  letter-spacing:-.4px;
}
.title p{
  margin:5px 0 0;
  font-size:9px;
  color:#7b8791;
}
.bell{
  width:44px;height:44px;
  display:grid;place-items:center;
  border:1px solid #cfe2f6;
  border-radius:14px;
  background:#fff;
  box-shadow:0 5px 16px rgba(0,93,225,.07);
}
.bell svg{
  width:19px;height:19px;
  fill:none;stroke:#005de1;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
.trip{
  overflow:hidden;
  border-radius:22px;
  background:linear-gradient(135deg,#002f71 0%,#005de1 56%,#049efa 100%);
  color:#fff;
  box-shadow:0 12px 28px rgba(0,74,184,.18);
}
.trip-main{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
}
.trip-icon{
  width:49px;height:49px;
  flex:0 0 49px;
  display:grid;place-items:center;
  border-radius:15px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.12);
  font-size:22px;
}
.trip-copy small{
  display:block;
  font-size:6px;
  font-weight:800;
  letter-spacing:.7px;
  color:rgba(255,255,255,.68);
}
.trip-copy h2{
  margin:4px 0 3px;
  font-size:17px;
  line-height:1.1;
  font-weight:850;
  color:#fff;
}
.trip-copy p{
  margin:0;
  font-size:7px;
  color:rgba(255,255,255,.65);
}
.trip-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px 10px 16px;
  border-top:1px solid rgba(255,255,255,.13);
  background:rgba(0,47,113,.28);
}
.orders{
  display:flex;
  align-items:center;
  gap:6px;
}
.orders small{
  font-size:6px;
  color:rgba(255,255,255,.62);
  font-weight:800;
}
.orders strong{
  font-size:12px;
  color:#fff;
}
.open-btn{
  min-height:34px;
  padding:0 12px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#005de1;
  font-size:8px;
  font-weight:850;
}
.section-head{
  margin:18px 1px 9px;
}
.section-head small{
  display:block;
  margin-bottom:3px;
  color:#8b9398;
  font-size:7px;
  font-weight:850;
  letter-spacing:.7px;
}
.section-head h3{
  margin:0;
  color:#171717;
  font-size:16px;
  font-weight:850;
  letter-spacing:-.25px;
}
.kpis{
  display:grid;
  grid-template-columns:1.35fr .8fr .8fr;
  gap:7px;
}
.kpi{
  min-height:76px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:11px;
  border:1px solid #d6e7f7;
  border-radius:17px;
  background:#fff;
  box-shadow:0 3px 14px rgba(0,93,225,.035);
}
.kpi span{
  display:block;
  margin-bottom:7px;
  color:#7391b2;
  font-size:7px;
  font-weight:800;
}
.kpi strong{
  display:block;
  color:#002f71;
  font-size:13px;
  font-weight:850;
  line-height:1.15;
}
.kpi:first-child strong{font-size:15px}
.all-trips{
  width:100%;
  min-height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
  padding:10px 12px;
  border:1px solid #d6e7f7;
  border-radius:17px;
  background:#fff;
  color:#171717;
}
.all-trips small{
  display:block;
  margin-bottom:2px;
  color:#8b9398;
  font-size:6px;
  font-weight:850;
  letter-spacing:.5px;
}
.all-trips strong{
  display:block;
  font-size:9px;
  font-weight:850;
}
.chev{
  color:#9a9a9a;
  font-size:17px;
}
.fab{
  position:absolute;
  right:16px;
  bottom:80px;
  width:58px;height:58px;
  border-radius:50%;
  background:#171717;
  color:#fff;
  display:grid;place-items:center;
  font-size:30px;
  font-weight:300;
  box-shadow:0 14px 28px rgba(0,0,0,.18);
}
.bottom-nav{
  position:absolute;
  left:0;right:0;bottom:0;
  height:70px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:center;
  border-top:1px solid #dbeaf7;
  background:rgba(255,255,255,.97);
}
.nav-item{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#91a6bd;
  font-size:7px;
  font-weight:700;
}
.nav-item.active{
  color:#005de1;
  background:#eef7ff;
  margin:7px 5px;
  height:56px;
  border:1px solid #d6e7f7;
  border-radius:17px;
}
.nav-item svg{
  width:18px;height:18px;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.badge{
  position:absolute;
  top:-3px;right:13px;
  width:15px;height:15px;
  border-radius:50%;
  background:#04a2e8;
  color:white;
  display:grid;place-items:center;
  font-size:6px;
}
.orders-item{position:relative}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo"></div>
    <div class="title">
      <small>SELLER DASHBOARD</small>
      <h1>Jastipinyuk</h1>
      <p>Selamat siang · cek aktivitas toko</p>
    </div>
    <div class="bell">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
    </div>
  </div>

  <section class="trip">
    <div class="trip-main">
      <div class="trip-icon">✈️</div>
      <div class="trip-copy">
        <small>ACTIVE TRIP</small>
        <h2>Jakarta, indonesia</h2>
        <p>25 Sep 2026 – 30 Sep 2026</p>
      </div>
    </div>
    <div class="trip-foot">
      <div class="orders"><small>ORDERS</small><strong>4</strong></div>
      <button class="open-btn">Open Trip ›</button>
    </div>
  </section>

  <div class="section-head">
    <small>OVERVIEW</small>
    <h3>Business Summary</h3>
  </div>

  <div class="kpis">
    <div class="kpi"><span>Revenue</span><strong>Rp 55.348.000</strong></div>
    <div class="kpi"><span>Orders</span><strong>4</strong></div>
    <div class="kpi"><span>Customers</span><strong>1</strong></div>
  </div>

  <div class="all-trips">
    <span><small>TRIP MANAGEMENT</small><strong>View all trips</strong></span>
    <span class="chev">›</span>
  </div>

  <div class="fab">+</div>

  <nav class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg>
      <span>Home</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 11 20 4l-7 17-2-7-8-3Z"></path></svg>
      <span>Trips</span>
    </div>
    <div class="nav-item orders-item">
      <span class="badge">2</span>
      <svg viewBox="0 0 24 24"><path d="M7 3h10v4H7z"></path><path d="M5 7h14v14H5z"></path><path d="M8 11h8M8 15h8"></path></svg>
      <span>Orders</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"></circle><path d="M5 20c0-4 3-7 7-7s7 3 7 7"></path></svg>
      <span>Me</span>
    </div>
  </nav>
</div>
</body>
</html>
