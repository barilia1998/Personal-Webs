<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#dededb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}
body{display:grid;place-items:center;min-height:100vh;padding:14px}
.phone{width:360px;min-height:690px;background:#f5f5f2;border:1px solid #d8d8d2;box-shadow:0 18px 40px rgba(0,0,0,.12);overflow:hidden}
.home-screen{padding:16px 14px 104px;background:#f5f5f2;position:relative}
.home-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.home-brand-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #e3e3dd;border-radius:14px;background:#fff;font-weight:900;font-size:12px}
.home-title-block{min-width:0;flex:1}.home-title-block>small{display:block;margin-bottom:4px;color:#9a9a94;font-size:6.5px;font-weight:850;letter-spacing:.75px}.home-title-block h1{margin:0;color:#171717;font-size:22px;font-weight:850;line-height:1.15;letter-spacing:-.4px}.home-title-block p{margin:4px 0 0;color:#8e8e88;font-size:8.5px}
.home-notification-button{width:42px;height:42px;border:1px solid #e3e3dd;border-radius:14px;background:#fff;display:grid;place-items:center}.home-notification-bell svg{width:18px;height:18px;fill:none;stroke:#171717;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home-trip-card{overflow:hidden;border-radius:22px;background:#171717;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.09)}.home-trip-card-head{display:flex;align-items:center;gap:13px;padding:16px}.home-trip-icon{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;background:#2a2a2a;font-size:23px}.home-trip-copy{min-width:0;flex:1}.home-trip-copy>span{display:block;margin-bottom:4px;color:#8d8d89;font-size:6.5px;font-weight:850;letter-spacing:.65px}.home-trip-copy h2{margin:0;color:#fff;font-size:17px;font-weight:850}.home-trip-copy p{margin:5px 0 0;color:#999;font-size:8px}.home-trip-card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-top:1px solid #2c2c2c;background:#1e1e1e}.home-trip-card-foot small{color:#777;font-size:6.5px;font-weight:850}.home-trip-card-foot strong{display:block;color:#fff;font-size:12px;font-weight:850}.home-trip-card-foot button{min-height:34px;padding:0 11px;border:0;border-radius:11px;background:#fff;color:#171717;font-size:8.5px;font-weight:850}
.home-section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:18px 1px 9px}.home-section-head small{display:block;margin-bottom:3px;color:#9a9a94;font-size:6.5px;font-weight:850;letter-spacing:.65px}.home-section-head h2{margin:0;color:#171717;font-size:15px;font-weight:850}
.home-kpi-grid{display:grid;grid-template-columns:1.35fr .8fr .8fr;gap:7px}.home-kpi-card{min-height:66px;display:flex;flex-direction:column;justify-content:center;padding:10px;border:1px solid #e4e4df;border-radius:15px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.02)}.home-kpi-card span{display:block;margin-bottom:5px;color:#999991;font-size:6.5px;font-weight:800}.home-kpi-card strong{font-size:13px;font-weight:850}
.home-attention-card{display:flex;align-items:center;gap:10px;margin-top:10px;padding:11px;border:1px solid #e6dff8;border-radius:16px;background:#f7f4ff}.home-attention-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#fff;font-size:17px}.home-attention-copy small{display:block;color:#766ba2;font-size:6px;font-weight:850;letter-spacing:.5px}.home-attention-copy strong{display:block;color:#342e4a;font-size:9.5px;font-weight:850;margin-top:2px}.home-attention-copy p{margin:2px 0 0;color:#887ea4;font-size:7.5px}
.home-all-trips{width:100%;min-height:54px;display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:10px 12px;border:1px solid #e3e3dd;border-radius:16px;background:#fff;color:#171717;text-align:left}.home-all-trips small{display:block;margin-bottom:2px;color:#999991;font-size:6px;font-weight:850;letter-spacing:.5px}.home-all-trips strong{font-size:9.5px;font-weight:850}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #e3e3dd;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.bottom-nav span{text-align:center;font-size:8px;color:#96968f}.bottom-nav span:first-child{color:#171717;font-weight:800}
</style></head><body><div class="phone"><section class="home-screen">
<div class="home-topbar"><div class="home-brand-icon">T</div><div class="home-title-block"><small>SELLER DASHBOARD</small><h1>Jastip Store</h1><p>Kelola trip dan order kamu</p></div><button class="home-notification-button"><span class="home-notification-bell"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg></span></button></div>
<div class="home-trip-card"><div class="home-trip-card-head"><div class="home-trip-icon">✈️</div><div class="home-trip-copy"><span>ACTIVE TRIP</span><h2>Bangkok Trip</h2><p>24 Sep 2026 – 30 Sep 2026</p></div></div><div class="home-trip-card-foot"><div><small>ORDERS</small><strong>18</strong></div><button>Open Trip</button></div></div>
<div class="home-section-head"><div><small>OVERVIEW</small><h2>Business Summary</h2></div></div>
<div class="home-kpi-grid"><div class="home-kpi-card"><span>Revenue</span><strong>Rp4.820.000</strong></div><div class="home-kpi-card"><span>Orders</span><strong>18</strong></div><div class="home-kpi-card"><span>Customers</span><strong>13</strong></div></div>
<div class="home-attention-card"><div class="home-attention-icon">💳</div><div class="home-attention-copy"><small>ACTION NEEDED</small><strong>Payment needs review</strong><p>Buyer sudah mengirim bukti pembayaran.</p></div></div>
<button class="home-all-trips"><span><small>TRIP MANAGEMENT</small><strong>View all trips</strong></span><span>›</span></button>
<div class="bottom-nav"><span>Home</span><span>Trip</span><span>Order</span><span>Me</span></div>
</section></div></body></html>
